pluginManagement {
    repositories {
        //mavenLocal()
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'MsNotificaciones'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':memoria'
project(':memoria').projectDir = file('./infrastructure/driven-adapters/memoria')
include ':kafka'
project(':kafka').projectDir = file('./infrastructure/entry-points/kafka')
include ':mq'
project(':mq').projectDir = file('./infrastructure/driven-adapters/mq')
include ':sms'
project(':sms').projectDir = file('./infrastructure/entry-points/sms')